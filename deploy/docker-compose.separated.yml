name: fishroom-management

services:
  frontend:
    image: fishroom-frontend:local
    container_name: fishroom-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8787}:80"
    restart: unless-stopped

  backend:
    image: fishroom-backend:local
    container_name: fishroom-backend
    environment:
      # Backend HTTP service
      HOST: 0.0.0.0
      PORT: 8787
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?AUTH_SESSION_SECRET must be set}
      ALLOW_DEFAULT_CREDENTIALS: ${ALLOW_DEFAULT_CREDENTIALS:-false}

      # Database connection. Change these in .env on the server.
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-fishroom}
      PGUSER: ${POSTGRES_USER:-fishroom}
      PGPASSWORD: ${POSTGRES_PASSWORD:-fishroom_local_password}

      # Optional single-string alternative. Leave empty when using PG* above.
      DATABASE_URL: ${DATABASE_URL:-}
      UPLOAD_DIR: /app/uploads
      VIDEO_TRANSCODE_CONCURRENCY: ${VIDEO_TRANSCODE_CONCURRENCY:-1}
      VIDEO_TRANSCODE_MAX_PENDING: ${VIDEO_TRANSCODE_MAX_PENDING:-2}
      VIDEO_TRANSCODE_THREADS: ${VIDEO_TRANSCODE_THREADS:-1}
      VIDEO_TRANSCODE_MAX_EDGE: ${VIDEO_TRANSCODE_MAX_EDGE:-1920}

      # Tencent Cloud COS. Leave empty to use local uploads.
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_REGION: ${COS_REGION:-}
      COS_PUBLIC_BASE_URL: ${COS_PUBLIC_BASE_URL:-}
      COS_PREFIX: ${COS_PREFIX:-fishroom}

      # AI assistant. AI_API_BASE_URL can point to any OpenAI-compatible API.
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.2}

      # Feishu integration. Webhook is used for push notifications; app credentials
      # are used to reply to Feishu message events.
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
      FEISHU_WEBHOOK_SECRET: ${FEISHU_WEBHOOK_SECRET:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_VERIFICATION_TOKEN: ${FEISHU_VERIFICATION_TOKEN:-}
      FEISHU_DEFAULT_SITE_ID: ${FEISHU_DEFAULT_SITE_ID:-all}
    volumes:
      - ../uploads:/app/uploads
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  database:
    image: fishroom-database:local
    container_name: fishroom-database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fishroom}
      POSTGRES_USER: ${POSTGRES_USER:-fishroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fishroom_local_password}
    volumes:
      - fishroom-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  fishroom-postgres-data:
    name: fishroom-split-postgres-data
