services:
  fishroom:
    build:
      context: .
      args:
        RELEASE_REVISION: ${RELEASE_REVISION:-local-development}
        RELEASE_BUILT_AT: ${RELEASE_BUILT_AT:-1970-01-01T00:00:00Z}
    container_name: fishroom-management-local
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?AUTH_SESSION_SECRET must be set}
      PERSONNEL_DATA_KEYRING_JSON: ${PERSONNEL_DATA_KEYRING_JSON:?PERSONNEL_DATA_KEYRING_JSON must be set}
      RELEASE_REVISION: ${RELEASE_REVISION:-local-development}
      RELEASE_BUILT_AT: ${RELEASE_BUILT_AT:-1970-01-01T00:00:00Z}
      POSTGRES_DB: fishroom
      POSTGRES_USER: fishroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGDATA: /var/lib/postgresql/data
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
      FEISHU_WEBHOOK_SECRET: ${FEISHU_WEBHOOK_SECRET:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_VERIFICATION_TOKEN: ${FEISHU_VERIFICATION_TOKEN:-}
      FEISHU_DEFAULT_SITE_ID: ${FEISHU_DEFAULT_SITE_ID:-all}
    ports:
      - "8787:8787"
    volumes:
      - fishroom-data:/app/.data
      - fishroom-postgres-data:/var/lib/postgresql/data
      - fishroom-uploads:/app/uploads
    restart: unless-stopped

volumes:
  fishroom-data:
    name: fishroom-data
  fishroom-postgres-data:
    name: fishroom-postgres-data
  fishroom-uploads:
    name: fishroom-uploads
